[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-lifetime-value"
version = "0.1.0"
description = "Google LTV prediction model"
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.3.2",
    "numpy>=2.3.3", 
    "pyyaml>=6.0",
    "tqdm>=4.67.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
